[package]
name = "colctl"
version = "2.2.0"
edition = "2024"
description = "Keep every AI coding harness on your machine in sync with one source of truth"
repository = "https://github.com/muradmadi-leadtech/colctl"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
console = "0.16.6"
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.1"
toml_edit = "0.25.19"
yaml-rust2 = "0.13.0"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"

[lints.rust]
unsafe_code = "forbid"
