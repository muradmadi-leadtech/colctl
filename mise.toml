[tools]
just = "1.59"
# rustfmt and clippy are part of the gate; CI's minimal toolchain lacks them without this.
rust = { version = "1.99", components = "rustfmt,clippy,llvm-tools-preview" }
# `just audit`: spelling, workflow mistakes and security problems, shell scripts, secrets.
typos = "1.51.1"
actionlint = "1.7.12"
zizmor = "1.31.1"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
# `just test`: line coverage, gated at 90% (FORGE cycle convention, see .forge/context.md).
"github:taiki-e/cargo-llvm-cov" = "0.9.1"
